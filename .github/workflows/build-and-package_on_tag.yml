name: Build and Package on Windows

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: |
          pyinstaller automation_tool.spec

      - name: Get tag name
        id: tag_name
        run: |
          echo "Extracting tag name from GITHUB_REF..."
          $tagName = $env:GITHUB_REF -replace 'refs/tags/', ''
          Write-Output "::set-output name=tag_version::$tagName"

      - name: Retrieve previous tag
        id: prev_tag
        run: |
          previous_tag=$(git describe --abbrev=0 --tags "$(git rev-list --tags --skip=1 --max-count=1)")
          echo "::set-output name=previous_tag::$previous_tag"

      - name: Retrieve commit messages
        id: commit_messages
        run: |
          git log --pretty=format:"%s" "${{ steps.prev_tag.outputs.previous_tag }}..${GITHUB_REF}" > commit_messages.txt
          echo "::set-output name=commit_messages::$(cat commit_messages.txt)"

      - name: Upload artifact
        uses: actions/upload-artifact@v2
        with:
          name: automation_tool_${{ steps.tag_name.outputs.tag_version }}
          path: dist/automation_tool.exe

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_name.outputs.tag_version }}
          release_name: Release ${{ steps.tag_name.outputs.tag_version }}
          body_file: commit_messages.txt

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/automation_tool.exe
          asset_name: automation_tool.exe
          asset_content_type: application/octet-stream